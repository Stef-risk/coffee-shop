server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: coffee-shop

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:coffeeshop}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: CoffeeShopPool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        default_batch_fetch_size: 20
    open-in-view: false

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

app:
  jwt:
    secret: ${JWT_SECRET:coffeeshop-super-secret-key-please-change-in-production-min-256bits}
    expiration-ms: ${JWT_EXPIRATION:86400000}      # 24 hours
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000}  # 7 days

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.stefan.coffeeshop: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
